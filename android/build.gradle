group 'dev.asdevs.signalr_flutter_appbundle'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Do NOT apply the Kotlin Gradle Plugin here. Flutter's tooling (3.44+) scans this
// file and applies Kotlin itself when no KGP reference is present (built-in Kotlin
// migration, see https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin).

android {
    compileSdk = 36
    namespace 'dev.asdevs.signalr_flutter_appbundle'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21 // java version
        targetCompatibility JavaVersion.VERSION_21 // java version
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk = 26
    }
    lint {
        disable 'InvalidPackage'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.12.0'
    // compile files('libs/signalr-client-sdk.jar')
    // compile files('libs/signalr-client-sdk-android.jar')
    // implementation files('libs/signalr-client-sdk.jar')
    // implementation files('libs/signalr-client-sdk-android.jar')
    implementation files('libs/signalr-client-sdk-2.0.0.jar')
    implementation files('libs/signalr-client-sdk-android-2.0.0.jar')
}
